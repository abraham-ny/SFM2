name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-22.04

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up Java 17
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Download Gradle 8.0 manually and add to PATH
    - name: Install Gradle 8.0
      run: |
        curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle-8.0.zip
        unzip gradle-8.0.zip -d $HOME
        echo "$HOME/gradle-8.0/bin" >> $GITHUB_PATH

    # 4. Generate gradle wrapper in the repo
    - name: Generate Gradle wrapper
      run: gradle wrapper --gradle-version 8.0 --distribution-type all

    # 5. Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 6. Cache Gradle wrapper and dependencies
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # 7. Decode keystore (for signing)
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release.jks

    # 8. Extract version info from tag
    - name: Extract version
      id: version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        CODE=$(( MAJOR*10000 + MINOR*100 + PATCH ))
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "versionCode=$CODE" >> $GITHUB_OUTPUT

    # 9. Inject version info into build.gradle
    - name: Stamp version into build.gradle
      run: |
        sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.versionCode }}/" app/build.gradle
        sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.version }}\"/" app/build.gradle

    # 10. Build release APK
    - name: Build release APK
      env:
        KEYSTORE_PATH:      ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --stacktrace --no-daemon

    # 11. Rename and upload APK
    - name: Upload APK artifact
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        echo "APK size: $(du -sh dist/SceneFind-${{ steps.version.outputs.tag }}.apk)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SceneFind-${{ steps.version.outputs.tag }}
        path: dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        retention-days: 90

    # 12. Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "SceneFind ${{ steps.version.outputs.tag }}"
        body: "Download SceneFind-${{ steps.version.outputs.tag }}.apk"
        draft: false
        prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        files: dist/SceneFind-${{ steps.version.outputs.tag }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}