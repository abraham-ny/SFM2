name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-22.04

    steps:

    # 1. Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Ensure Android SDK path
    - name: Set Android SDK path
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    # 4. Cache Gradle (ONLY useful cache)
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/wrapper
          ~/.gradle/caches
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # 5. Make gradlew executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 6. Decode keystore
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

    # 7. Extract version from tag
    - name: Extract version
      id: version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        MAJOR=$(echo "$VERSION" | cut -d. -f1 | grep -o '^[0-9]*')
        MINOR=$(echo "$VERSION" | cut -d. -f2 | grep -o '^[0-9]*')
        PATCH=$(echo "$VERSION" | cut -d. -f3 | grep -o '^[0-9]*')

        MAJOR=${MAJOR:-1}
        MINOR=${MINOR:-0}
        PATCH=${PATCH:-0}

        CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

        echo "versionCode=$CODE" >> $GITHUB_OUTPUT

        echo "Tag=$TAG Version=$VERSION Code=$CODE"

    # 8. Inject version into Gradle
    - name: Stamp version
      run: |
        sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.versionCode }}/" app/build.gradle
        sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.version }}\"/" app/build.gradle

        echo "--- VERSION CHECK ---"
        grep -E 'versionCode|versionName' app/build.gradle

    # 9. Build release APK
    - name: Build release APK
      env:
        KEYSTORE_PATH: release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --stacktrace \
          --no-daemon

    # 10. Rename APK
    - name: Rename APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk \
           dist/SceneFind-${{ steps.version.outputs.tag }}.apk

        echo "APK SIZE:"
        du -sh dist/*

    # 11. Upload artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SceneFind-${{ steps.version.outputs.tag }}
        path: dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        retention-days: 90

    # 12. Create GitHub Release
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: SceneFind ${{ steps.version.outputs.tag }}
        body: |
          ## SceneFind ${{ steps.version.outputs.tag }}

          Download the APK below and install manually.

          ### Requirements
          - Android 4.4+ (API 19)
          - Internet connection
          - Microphone permission

        files: dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Debug builds (non-tags)
  build-debug:
    name: Debug Build
    runs-on: ubuntu-22.04
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set SDK path
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/app-debug.apk