name: Release APK

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Fires on any tag that starts with "v" (e.g. v1.0.0, v2.3.1-beta)
on:
  push:
    tags:
      - 'v*'

# ─── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases and upload assets

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-22.04

    steps:

    # 1. Checkout full source
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up JDK 17 (required by AGP 8.x)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Cache Gradle + Android SDK components
    - name: Cache Gradle wrapper
      uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper
        key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Cache Gradle caches
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-caches-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-caches-${{ runner.os }}-

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}
        key: android-sdk-${{ runner.os }}-34

    # 4. Grant gradlew execute permission
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 5. Decode the keystore from the base64 secret
    #    Store a base64-encoded .jks in secret KEYSTORE_BASE64
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.jks

    # 6. Extract the tag name for versioning (strips leading "v")
    - name: Extract version from tag
      id: version
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        VERSION="${TAG#v}"
        echo "tag=$TAG"         >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        # Compute versionCode: major*10000 + minor*100 + patch
        # e.g. v1.2.3 → 10203   v1.0.0 → 10000   v2.0.0 → 20000
        MAJOR=$(echo "$VERSION" | cut -d. -f1 | grep -o '^[0-9]*')
        MINOR=$(echo "$VERSION" | cut -d. -f2 | grep -o '^[0-9]*')
        PATCH=$(echo "$VERSION" | cut -d. -f3 | grep -o '^[0-9]*')
        MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
        CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
        echo "versionCode=$CODE" >> $GITHUB_OUTPUT
        echo "Tag=$TAG  Version=$VERSION  Code=$CODE"

    # 7. Inject versionName + versionCode into build.gradle
    - name: Stamp version into build.gradle
      run: |
        sed -i \
          "s/versionCode .*/versionCode ${{ steps.version.outputs.versionCode }}/" \
          app/build.gradle
        sed -i \
          "s/versionName .*/versionName \"${{ steps.version.outputs.version }}\"/" \
          app/build.gradle
        echo "--- app/build.gradle after stamp ---"
        grep -E 'versionCode|versionName' app/build.gradle

    # 8. Build the release APK (unsigned first via assembleRelease)
    - name: Build release APK
      env:
        KEYSTORE_PATH:      ${{ github.workspace }}/release.jks
        KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
          -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --stacktrace \
          --no-daemon

    # 9. Rename APK to include version tag
    - name: Rename APK
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk \
           dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        echo "APK size: $(du -sh dist/SceneFind-${{ steps.version.outputs.tag }}.apk)"

    # 10. Upload APK as workflow artifact (always available, even without a Release)
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: SceneFind-${{ steps.version.outputs.tag }}
        path: dist/SceneFind-${{ steps.version.outputs.tag }}.apk
        retention-days: 90

    # 11. Create GitHub Release and attach the APK
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name:   ${{ steps.version.outputs.tag }}
        name:       "SceneFind ${{ steps.version.outputs.tag }}"
        body:       |
          ## SceneFind ${{ steps.version.outputs.tag }}

          ### Install
          Download **SceneFind-${{ steps.version.outputs.tag }}.apk** below and sideload it.
          You may need to allow *Install from unknown sources* in Android Settings.

          ### Requirements
          - Android 4.4+ (API 19)
          - Microphone permission
          - Internet connection

          ### What's new
          _See commit history for changes in this release._
        draft:      false
        prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        files:      dist/SceneFind-${{ steps.version.outputs.tag }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─── Build-only job for non-tag pushes / PRs (debug, no signing) ─────────────
  build-debug:
    name: Build Debug APK (PR / branch check)
    runs-on: ubuntu-22.04
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/wrapper
          ~/.gradle/caches
        key: gradle-debug-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SceneFind-debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
