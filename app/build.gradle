apply plugin: 'com.android.application'

// ── Local keystore support ────────────────────────────────────────────────────
// For local builds: create app/keystore.properties with these four keys.
// For CI: values are injected via -P flags by the GitHub Actions workflow.
def keystorePropsFile = rootProject.file("app/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.vitalsoft.sfm"
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    // ── Signing ───────────────────────────────────────────────────────────────
    signingConfigs {
        release {
            // Prefer -P injection (CI), fall back to keystore.properties (local)
            storeFile file(
                project.hasProperty('android.injected.signing.store.file')
                    ? project.property('android.injected.signing.store.file')
                    : (keystoreProps['storeFile'] ?: 'release.jks')
            )
            storePassword(
                project.hasProperty('android.injected.signing.store.password')
                    ? project.property('android.injected.signing.store.password')
                    : (keystoreProps['storePassword'] ?: '')
            )
            keyAlias(
                project.hasProperty('android.injected.signing.key.alias')
                    ? project.property('android.injected.signing.key.alias')
                    : (keystoreProps['keyAlias'] ?: '')
            )
            keyPassword(
                project.hasProperty('android.injected.signing.key.password')
                    ? project.property('android.injected.signing.key.password')
                    : (keystoreProps['keyPassword'] ?: '')
            )
        }
    }

    // ── Build types ───────────────────────────────────────────────────────────
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    // ── Java compatibility ────────────────────────────────────────────────────
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    // ── Lint ──────────────────────────────────────────────────────────────────
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    // ── Output APK naming ─────────────────────────────────────────────────────
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def vName = variant.versionName
            def buildType = variant.buildType.name
            outputFileName = "SceneFind-${buildType}-${vName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
